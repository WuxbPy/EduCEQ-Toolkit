[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "educeq"
version = "1.1.0"
description = "EduCEQ-Toolkit: co-enrichment quotient (CEQ) structure diagnosis with runtime decidability contracts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Junqiang Wu" },
  { name = "Feipeng Li" },
  { name = "Wenfeng He" },
  { name = "Xibo Wu" },
]
keywords = [
  "co-enrichment quotient",
  "colocation quotient",
  "point pattern analysis",
  "permutation inference",
  "decidability",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[tool.setuptools.packages.find]
include = ["educeq*"]
